# 알람 심각도와 억제 규칙
#
# 핵심 설계: 매일 발동하는 룰과 평소 조용한 룰을 구분한다.
# X01/X03/X04(참조 무결성)는 이 데이터셋의 상수에 가까워서
# 단순 FAIL 로 알리면 매일 울리는 소음이 된다.
# 기준선 대비 배수를 넘을 때만 알린다.

severities:
  P1:
    label: 배치 장애
    emoji: "🚨"
    color: "#d32f2f"
  P2:
    label: 품질 이상
    emoji: "⚠️"
    color: "#f57c00"
  P3:
    label: 지표 급변
    emoji: "📊"
    color: "#1976d2"

# 룰을 심각도에 배정한다. 여기 없는 룰은 알람 대상이 아니다.
rule_severity:
  C03: P2      # PK 중복
  D02: P2      # 범주형 신규 값. 평상시 0건이므로 1건만 나와도 알린다
  D08: P2      # 격리율. 비율·건수 조건을 모두 넘은 경우만 FAIL 로 올라옴
  C05: P3      # 적재 0건
  D01: P3      # 결측률 급변
  D05: P3      # 적재량 급변

# 참조 무결성 룰: 기준선 × 배수를 초과할 때만 알린다
baseline_multiplier:
  X01: { baseline: 8,  factor: 3, severity: P2 }   # 평상시 5~10건 → 24건 초과
  X03: { baseline: 2,  factor: 5, severity: P2 }   # 평상시 0~3건  → 10건 초과
  X04: { baseline: 70, factor: 3, severity: P2 }   # 평상시 57~79건 → 210건 초과

suppression:
  window_hours: 24    # 같은 (룰, 테이블) 조합은 24시간에 1회만

  # 룰 설명. Slack 메시지에 함께 표시해 담당자가 코드를 보지 않아도
# 무엇이 문제이고 무엇을 해야 하는지 알 수 있게 한다.
rule_info:
  F01:
    title: 배치 미실행
    what: 해당 날짜의 배치 기록이 전혀 없습니다
    why: 스케줄러가 돌지 않았거나 실행 전 단계에서 중단됨
    action: GitHub Actions 실행 이력 확인 → 수동 재실행

  F02:
    title: 배치 단계 실패
    what: 파이프라인 단계 중 하나가 오류로 중단됐습니다
    why: DB 연결 실패, 제약조건 위반, 데이터 형식 오류 등
    action: 로그 확인 후 원인 제거 → 해당 날짜 재실행

  F03:
    title: 배치 미완료
    what: 단계가 RUNNING 상태로 남아 있습니다
    why: 프로세스가 강제 종료되었거나 타임아웃
    action: 중복 실행 여부 확인 → 해당 날짜 재실행

  F04:
    title: 단계 누락
    what: 일부 단계가 실행되지 않았습니다
    why: 중간에 중단되었거나 수동으로 일부만 실행
    action: 누락 단계부터 재실행

  C03:
    title: 기본키 중복
    what: 같은 식별자를 가진 행이 둘 이상 들어왔습니다
    why: 상류 중복 전송, 또는 재생 로직의 구간 중복
    action: quarantine 에서 중복 행 확인 → 상류 전송 로그 대조

  C05:
    title: 적재 0건
    what: 해당 테이블에 데이터가 하나도 도착하지 않았습니다
    why: 상류 시스템 중단, 또는 수집 대상 기간에 데이터 없음
    action: 상류 상태 확인 → 데이터 없음이 정상인지 판단

  D01:
    title: 결측률 급변
    what: 특정 컬럼의 NULL 비율이 평소와 크게 달라졌습니다
    why: 상류 필드 누락, 수집 로직 변경, 정제 단계 오류
    action: 해당 컬럼의 _raw 값 확인 → 상류 스키마 변경 여부 문의

  D02:
    title: 허용되지 않은 범주값
    what: 사전에 정의된 목록에 없는 값이 들어왔습니다
    why: 상류에서 정규화되지 않은 원본 값이 유입됨
    action: >
      quarantine 에서 실제 값 확인 → 오탈자면 매핑 추가,
      정식 신규 값이면 CHECK 제약과 baseline.yml 갱신

  D05:
    title: 적재량 급변
    what: 행 수가 평소 수준에서 크게 벗어났습니다
    why: 상류 장애(감소), 중복 전송이나 백필(증가)
    action: 상류 전송 건수와 대조 → 누락분 재수집 요청

  D08:
    title: 격리율 초과
    what: 검증에서 제외된 행의 비율이 임계를 넘었습니다
    why: 특정 룰에 대량으로 걸림. 상류 데이터 품질 저하
    action: 룰별 격리 건수 확인 → 가장 많이 걸린 룰부터 조사

  X01:
    title: 주문의 고객 참조 실패
    what: 존재하지 않는 고객 ID를 가진 주문이 급증했습니다
    why: 고객 마스터 동기화 지연, 또는 상류 ID 체계 변경
    action: 해당 고객이 나중에 들어오는지 확인 → 재처리 검토

  X03:
    title: 티켓의 고객 참조 실패
    what: 존재하지 않는 고객 ID를 가진 문의가 급증했습니다
    why: 고객 마스터 동기화 지연
    action: 고객 마스터 적재 시각 확인

  X04:
    title: 행동로그의 고객 참조 실패
    what: 존재하지 않는 고객 ID를 가진 이벤트가 급증했습니다
    why: 고객 마스터 동기화 지연, 또는 비로그인 식별 오류
    action: 고객 마스터 적재 시각 확인 → is_logged_in 정합성 점검